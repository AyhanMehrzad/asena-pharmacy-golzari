<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001e4d"/>
      <stop offset="60%" stop-color="#002d72"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Centered Brand Paw Emblem with Cross -->
  <g transform="translate(68, 60) scale(3.8)" filter="url(#glow)">
    <!-- Central Pad -->
    <path d="M 50 65 C 38 65, 30 75, 35 90 C 40 102, 60 102, 65 90 C 70 75, 62 65, 50 65 Z" fill="url(#pawGrad)"/>
    <!-- Outer Toes -->
    <ellipse cx="28" cy="58" rx="8" ry="12" transform="rotate(-25 28 58)" fill="url(#pawGrad)"/>
    <ellipse cx="43" cy="44" rx="8" ry="13" transform="rotate(-8 43 44)" fill="url(#pawGrad)"/>
    <ellipse cx="57" cy="44" rx="8" ry="13" transform="rotate(8 57 44)" fill="url(#pawGrad)"/>
    <ellipse cx="72" cy="58" rx="8" ry="12" transform="rotate(25 72 58)" fill="url(#pawGrad)"/>
    <!-- Medical Cross Emblem inside -->
    <path d="M 47 77 L 53 77 L 53 81 L 57 81 L 57 85 L 53 85 L 53 89 L 47 89 L 47 85 L 43 85 L 43 81 L 47 81 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
