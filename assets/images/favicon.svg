<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Blue Paw Gradient matching ASENA palette -->
    <linearGradient id="pawBlue" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0055ff"/>
      <stop offset="45%" stop-color="#0047d4"/>
      <stop offset="100%" stop-color="#002d99"/>
    </linearGradient>

    <!-- Subtle 3D Highlight Gradient for Pad Depth -->
    <linearGradient id="pawHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#003bb5" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0038b8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Outer Left Toe -->
    <ellipse cx="145" cy="240" rx="38" ry="50" transform="rotate(-28 145 240)" fill="url(#pawBlue)"/>

    <!-- Center Left Toe -->
    <ellipse cx="212" cy="180" rx="39" ry="54" transform="rotate(-9 212 180)" fill="url(#pawBlue)"/>

    <!-- Center Right Toe -->
    <ellipse cx="300" cy="180" rx="39" ry="54" transform="rotate(9 300 180)" fill="url(#pawBlue)"/>

    <!-- Outer Right Toe -->
    <ellipse cx="367" cy="240" rx="38" ry="50" transform="rotate(28 367 240)" fill="url(#pawBlue)"/>

    <!-- Main Central Pad -->
    <!-- Custom smooth cubic bezier path for organic rounded paw pad -->
    <path d="M 256 226
             C 216 226, 172 262, 168 308
             C 164 350, 192 376, 218 376
             C 238 376, 248 360, 256 360
             C 264 360, 274 376, 294 376
             C 320 376, 348 350, 344 308
             C 340 262, 296 226, 256 226 Z"
          fill="url(#pawBlue)"/>
  </g>
</svg>
